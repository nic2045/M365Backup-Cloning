name: ci-ui
on:
  pull_request:
    paths:
      - "web/ui/**"
      - "web/api/**"
      - "web/openapi.json"
      - "web/mock/**"
      - ".github/workflows/ci-ui.yml"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --require-hashes -r web/ui/requirements-dev.txt
      - name: Pytest
        working-directory: web/ui
        run: pytest
