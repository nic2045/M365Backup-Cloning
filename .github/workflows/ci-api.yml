name: ci-api
# Runs only by hand (Actions > Run workflow): no GitHub Actions budget (ADR 0022). The checks run locally: pwsh scripts/Test-Local.ps1
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --require-hashes -r web/api/requirements-dev.txt
      - name: Pytest
        run: pytest web/api
