name: ci-api
on:
  pull_request:
    paths:
      - "web/api/**"
      - "web/openapi.json"
      - "web/mock/**"
      - "schema/**"
      - ".github/workflows/ci-api.yml"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r web/api/requirements-dev.txt
      - name: Pytest
        run: pytest web/api
