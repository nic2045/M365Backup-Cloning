name: ci
# Runs only by hand (Actions > Run workflow): no GitHub Actions budget (ADR 0022). The checks run locally: pwsh scripts/Test-Local.ps1
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser
          Invoke-Pester -Path tests -CI
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
